# Sample Argo CD Application — syncs the sample app to EKS.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eks-sample-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/prasannaporeddy/eks-platform-sample.git
    targetRevision: HEAD
    path: app/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: sample-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
