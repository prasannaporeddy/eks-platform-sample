name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sample app image
        run: docker build -t eks-sample-app ./app
      - name: Terraform format check
        run: terraform fmt -check -recursive terraform || true
